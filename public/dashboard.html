<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — LabFis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="mesh-bg" aria-hidden="true">
      <div class="mesh-orb mesh-orb-1"></div>
      <div class="mesh-orb mesh-orb-2"></div>
      <div class="mesh-orb mesh-orb-3"></div>
      <div class="mesh-grain"></div>
    </div>

    <main class="login-shell">
      <section class="login-card dashboard-card" aria-labelledby="dashboard-title">
        <header class="card-header">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 36 36" fill="none">
                <ellipse
                  cx="18"
                  cy="18"
                  rx="12.5"
                  ry="5.2"
                  transform="rotate(35 18 18)"
                  stroke="currentColor"
                  stroke-width="1.75"
                />
                <ellipse
                  cx="18"
                  cy="18"
                  rx="12.5"
                  ry="5.2"
                  transform="rotate(-35 18 18)"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-opacity="0.7"
                />
                <circle cx="18" cy="18" r="2.75" fill="currentColor" />
              </svg>
            </span>
            <span class="brand-name">Lab<span>Fis</span></span>
          </div>
          <h1 id="dashboard-title" class="card-title">Sesi Aktif LabFis</h1>
          <p class="card-subtitle">Sistem Manajemen Laboratorium Fisika</p>
        </header>

        <div class="dash-profile">
          <div id="user-avatar" class="dash-avatar" aria-hidden="true">LF</div>
          <div class="dash-user-meta">
            <h2 id="user-name" class="dash-user-name">Memuat...</h2>
            <p id="user-email" class="dash-user-email">-</p>
            <span id="user-role" class="dash-badge">-</span>
          </div>
        </div>

        <div class="dash-details">
          <div class="dash-row">
            <span class="dash-label">Metode Masuk</span>
            <span id="login-provider" class="dash-value">-</span>
          </div>
          <div class="dash-row">
            <span class="dash-label">Waktu Masuk</span>
            <span id="login-time" class="dash-value">-</span>
          </div>
          <div class="dash-row">
            <span class="dash-label">Notifikasi Gmail</span>
            <span id="gmail-status" class="dash-value">-</span>
          </div>
        </div>

        <button type="button" id="logout-btn" class="btn-logout">Keluar</button>
      </section>
    </main>

    <script>
      (() => {
        const avatarEl = document.getElementById('user-avatar');
        const nameEl = document.getElementById('user-name');
        const emailEl = document.getElementById('user-email');
        const roleEl = document.getElementById('user-role');
        const providerEl = document.getElementById('login-provider');
        const timeEl = document.getElementById('login-time');
        const gmailStatusEl = document.getElementById('gmail-status');
        const logoutBtn = document.getElementById('logout-btn');

        function getInitials(name, email) {
          const source = (name || email || 'LF').trim();
          const parts = source.split(/\s+/).filter(Boolean);
          if (parts.length >= 2) {
            return (parts[0][0] + parts[1][0]).toUpperCase();
          }
          return source.slice(0, 2).toUpperCase();
        }

        async function loadSession() {
          try {
            const response = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (!response.ok) {
              window.location.replace('/');
              return;
            }

            const data = await response.json();
            const user = data?.user;
            if (!user) {
              window.location.replace('/');
              return;
            }

            nameEl.textContent = user.name || user.email;
            emailEl.textContent = user.email;
            roleEl.textContent = user.role || 'Pengguna';
            providerEl.textContent =
              user.provider === 'google' ? 'Google OAuth' : 'Email & Password';

            if (user.loginAt) {
              timeEl.textContent =
                new Date(user.loginAt).toLocaleString('id-ID', {
                  dateStyle: 'medium',
                  timeStyle: 'short',
                  timeZone: 'Asia/Jakarta',
                }) + ' WIB';
            }

            gmailStatusEl.textContent = data.gmailConfigured
              ? 'Aktif (Terkirim)'
              : 'Menunggu GMAIL_USER di .env';

            const initials = getInitials(user.name, user.email);
            avatarEl.textContent = initials;

            if (typeof user.picture === 'string' && user.picture.startsWith('https://')) {
              const img = document.createElement('img');
              img.src = user.picture;
              img.alt = user.name || 'Foto profil';
              img.referrerPolicy = 'no-referrer';
              img.addEventListener('error', () => {
                avatarEl.textContent = initials;
              });
              avatarEl.textContent = '';
              avatarEl.appendChild(img);
            }
          } catch {
            window.location.replace('/');
          }
        }

        logoutBtn.addEventListener('click', async () => {
          logoutBtn.disabled = true;
          logoutBtn.textContent = 'Keluar...';
          try {
            await fetch('/api/auth/logout', {
              method: 'POST',
              credentials: 'same-origin',
            });
          } finally {
            window.location.replace('/');
          }
        });

        loadSession();
      })();
    </script>
  </body>
</html>
